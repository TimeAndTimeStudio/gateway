services:
  - type: web
    name: starling-github-gateway
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: starling-gateway-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: STORE_DIR
        value: /var/data/starling
      - key: GATEWAY_PUBLIC_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: starling-client
      - key: GITHUB_REPO
        value: mod-builds
      - key: GITHUB_REF
        value: main
      - key: GITHUB_WORKFLOW
        value: build.yml
      - key: MAX_ACTIVE
        value: "8"
      - key: MAX_QUEUE
        value: "24"
